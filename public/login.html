<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>rusminter</title>
  <link rel="icon" type="image/png" href="/logo-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style-v2.css?v=3">

</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-brand-row">
      <div class="login-logo">&#187;</div>
      <span class="login-brand-name">rusminter</span>
    </div>

    <div class="login-mascot" aria-hidden="true">
      <svg viewBox="0 0 210 180" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M69 58 61 25c21 5 32 19 38 31"/>
        <path d="m133 55 18-31c16 17 18 35 9 48"/>
        <path d="M76 58c-22 10-34 31-29 52 6 25 31 40 59 35 28-4 48-25 45-49-3-25-27-43-55-42-8 0-14 1-20 4Z"/>
        <path d="m76 87 17 10-15 17"/>
        <path d="m133 84-14 12 17 13"/>
        <path d="M97 121c8 5 17 5 25-1"/>
        <path d="m105 109 5 4 5-5"/>
        <path d="M49 99 25 94M50 108l-27 5M151 97l26-7M151 107l28 2"/>
        <path d="M71 142c-7 8-10 20-3 28 9 11 34 8 51 9 19 1 33 0 35-11 2-9-5-15-18-17"/>
        <path d="M134 146c13-4 25-12 28-24 4-15-5-28-17-25"/>
        <path d="M83 148c10 6 29 7 42 3 11-4 22 0 21 12-2 15-28 11-43 11"/>
        <path d="m92 50 4-16 10 8 8-12 8 17-15 8Z"/>
        <path d="m96 34 10-2 8-2"/>
      </svg>
    </div>

    <div class="login-heading">
      <span>secure access</span>
      <h1>access console</h1>
    </div>
    <p id="login-subtitle" class="login-subtitle">sign in to continue</p>

    <form id="login-form" class="hidden">
      <div class="login-field">
        <input type="password" id="login-password" placeholder="password" autocomplete="current-password" autofocus>
      </div>
      <button id="login-btn" type="submit" class="action-btn primary">sign in</button>
      <div id="login-error" class="login-error hidden"></div>
    </form>

    <form id="setup-form" class="hidden">
      <p class="setup-hint">no password configured. set one to secure the panel.</p>
      <div class="login-field">
        <input type="password" id="setup-password" placeholder="new password" autocomplete="new-password" autofocus>
      </div>
      <div class="login-field">
        <input type="password" id="setup-confirm" placeholder="confirm password" autocomplete="new-password">
      </div>
      <button id="setup-btn" type="submit" class="action-btn primary">set password</button>
      <div id="setup-error" class="login-error hidden"></div>
    </form>

    <div id="loading" class="login-loading">connecting...</div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
